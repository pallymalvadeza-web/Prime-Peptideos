<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Preços</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e3e6eb;--ac:#128c4a;--acx:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--tx:#eef1f5;--mut:#98a2b3;--bd:#2a3038;--ac:#25b866;--acx:#04210f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:20px 16px 8px;max-width:760px;margin:0 auto}h1{margin:0;font-size:22px}.sub{color:var(--mut);font-size:14px;margin-top:4px}
.off{max-width:728px;margin:8px 16px 4px;background:var(--ac);color:var(--acx);border-radius:12px;padding:12px 14px;font-weight:700;text-align:center}
@media (min-width:792px){.off{margin:8px auto 4px}}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 16px;max-width:760px;margin:0 auto;display:flex;gap:8px;z-index:2}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;min-width:0}
input{flex:1}select{max-width:42%}
main{max-width:760px;margin:0 auto;padding:4px 16px 32px}.cnt{color:var(--mut);font-size:13px;margin:6px 2px 10px}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.b{font-size:11px;letter-spacing:.04em;color:var(--mut);text-transform:uppercase}.n{font-weight:600;margin:2px 0;overflow-wrap:anywhere}.p{font-size:18px;font-weight:700;color:var(--ac)}
.w{background:var(--ac);color:var(--acx);text-decoration:none;font-weight:600;font-size:14px;padding:10px 12px;border-radius:10px;white-space:nowrap}
.emp{text-align:center;color:var(--mut);padding:30px 0}footer{max-width:760px;margin:0 auto;padding:0 16px 24px;color:var(--mut);font-size:12px}
</style></head><body>
<header><h1 id="t"></h1><div class="sub" id="s"></div></header>
<div class="off" id="o" hidden></div>
<div class="bar"><input id="q" type="search" placeholder="Buscar produto..."><select id="m"><option value="">Todas as marcas</option></select></div>
<main><div class="cnt" id="c"></div><div id="l"></div></main>
<footer id="f"></footer>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
document.title=CONFIG.titulo;$("t").textContent=CONFIG.titulo;$("s").textContent=CONFIG.subtitulo;
if(CONFIG.promocao){$("o").hidden=false;$("o").textContent=CONFIG.promocao}
$("f").textContent=CONFIG.rodape||"";
const f=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const num=s=>{s=String(s).trim().replace(/[R$\s]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isNaN(n)?null:n};
function csv(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"){r.push(c);rows.push(r);r=[];c=""}else if(ch!="\r")c+=ch}
 if(c||r.length){r.push(c);rows.push(r)}return rows}
let D=[];const q=$("q"),m=$("m"),l=$("l"),c=$("c");
function r(){const t=norm(q.value.trim()),b=m.value;
const a=D.filter(x=>(!b||x[0]===b)&&(!t||norm(x[1]+" "+x[0]).includes(t)));
c.textContent=a.length+" produto"+(a.length===1?"":"s");
l.innerHTML=a.length?a.map(x=>{
const btn=CONFIG.whatsapp?'<a class="w" href="https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent("Olá! Tenho interesse em: "+x[1]+" ("+f(x[2])+")")+'" target="_blank" rel="noopener">Pedir</a>':"";
return '<div class="it"><div><div class="b">'+esc(x[0])+'</div><div class="n">'+esc(x[1])+'</div><div class="p">'+f(x[2])+'</div></div>'+btn+'</div>'}).join(""):'<div class="emp">Nenhum produto encontrado.</div>'}
async function load(){
 if(!CONFIG.planilhaCsv){c.textContent="";l.innerHTML='<div class="emp">Falta colar o link da planilha em config.js.</div>';return}
 try{const res=await fetch(CONFIG.planilhaCsv+(CONFIG.planilhaCsv.includes("?")?"&":"?")+"t="+Date.now());
  const rows=csv(await res.text()).slice(1);
  D=rows.map(x=>[(x[0]||"").trim(),(x[1]||"").trim(),num(x[2]||"")]).filter(x=>x[1]&&x[2]!==null);
  [...new Set(D.map(x=>x[0]).filter(Boolean))].sort().forEach(b=>{const o=document.createElement("option");o.value=o.textContent=b;m.appendChild(o)});
  r()}catch(e){c.textContent="";l.innerHTML='<div class="emp">Não consegui carregar a lista. Tente de novo em instantes.</div>'}}
q.oninput=m.onchange=r;load();
</script></body></html>
